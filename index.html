<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
function validateForm(){
    let username = document.getElementById("username").value;
    let email = document.getElementById("email").value;

    let usernameValid = true;
    let emailValid = true;

    // Validación de username
    if(username.length < 6){
        document.getElementById("usernameError").innerText = "El nombre de usuario debe tener más de 6 caracteres.";
        usernameValid = false;
    } else {
        document.getElementById("usernameError").innerText = "";
    }

    // Validación de email
    if(email.indexOf('@') === -1){
        document.getElementById("emailError").innerText = "El email tiene que contener un @.";
        emailValid = false;
    } else {
        document.getElementById("emailError").innerText = "";
    }

    return usernameValid && emailValid;
}
</script>

    
</head>
<body>
    <form id="registrationForm" onsubmit="return validateForm()">
        Username: <input type="text" id="username" required>
        <span id="usernameError" style="color: red"></span><br>
        Email: <input type="text" id="email" required>
        <span id="emailError" style="color: red"></span>
        <button type="submit">Register</button>

    </form>

</body>
</html>
